[project]
name = "pipeline"
version = "0.1.0"
description = "Chaîne de données : dépense publique par élève, établissement par établissement"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.5"

[tool.uv.build-backend]
module-root = ""
module-name = "pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not reseau"'
markers = [
    "reseau: test qui a besoin d'internet, sauté par défaut (uv run pytest -m reseau)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
